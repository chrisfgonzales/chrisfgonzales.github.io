<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="VibeOS is a local-first workspace for focus, memory, and routines.">
  <title>VibeOS</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app" class="app">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="VibeOS home">
        <span class="brand-mark" aria-hidden="true">V</span>
        <span><strong>VibeOS</strong><small id="connectionStatus">Saved on this device</small></span>
      </a>
      <div class="top-actions">
        <button id="installBtn" class="icon-button" type="button" aria-label="Install VibeOS" title="Install VibeOS">↓</button>
        <button id="themeBtn" class="icon-button" type="button" aria-label="Change appearance" title="Appearance">◐</button>
      </div>
    </header>

    <aside class="sidebar" aria-label="Primary navigation">
      <nav id="sideNav" class="side-nav"></nav>
      <section class="privacy-card">
        <strong>Local-first</strong>
        <p>Your work stays on this device.</p>
        <button class="text-button" data-route="settings" data-panel="privacy">Privacy details</button>
      </section>
    </aside>

    <main id="main" tabindex="-1"></main>

    <nav id="bottomNav" class="bottom-nav" aria-label="Primary navigation"></nav>
    <button id="quickAction" class="quick-action" type="button" aria-label="Create workspace">+</button>
  </div>

  <dialog id="dialog" aria-labelledby="dialogTitle">
    <form method="dialog" id="dialogForm" class="dialog-card">
      <div id="dialogBody"></div>
      <div class="dialog-actions"><button value="cancel">Close</button></div>
    </form>
  </dialog>

  <template id="toastTemplate"><div class="toast" role="status"></div></template>
  <script src="app.js"></script>
</body>
</html>
