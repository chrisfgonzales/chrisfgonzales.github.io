name: Release VibeOS APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing VibeOS release tag, for example vibeos-v1.0.0
        required: true
        type: string
  push:
    tags:
      - "vibeos-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate web source
        run: node vibeos/scripts/verify-vibeos.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Lint and build Android APK
        run: ./vibeos/src/android/gradlew -p vibeos/src/android lintDebug assembleDebug --stacktrace --no-daemon
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 ||
            gh release create "$RELEASE_TAG" --title "VibeOS ${RELEASE_TAG#vibeos-v}" --generate-notes
          gh release upload "$RELEASE_TAG" vibeos/src/android/app/build/outputs/apk/debug/app-debug.apk#VibeOS.apk --clobber
